<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Maze Explorer 학습</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#e9f1f7;font:16px/1.5 system-ui,sans-serif}main{max-width:940px;margin:auto;padding:30px 18px}h1,h2{line-height:1.2}p{color:#b7c9d6}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:5px;font-size:14px}input,select,button{font:inherit;color:inherit;border:1px solid #527287;background:#192b38;border-radius:7px;padding:8px;max-width:100%}input[type=number]{width:135px}button{cursor:pointer}button.primary{background:#91e8d0;color:#102323;font-weight:700}button:disabled{opacity:.45;cursor:default}section{background:#17232e;border:1px solid #324658;border-radius:12px;padding:18px;margin:18px 0}.output{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:20px}canvas{width:100%;image-rendering:pixelated;background:#0c141c}progress{width:100%;accent-color:#91e8d0}dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px}dd{margin:0;font-variant-numeric:tabular-nums}small{color:#b7c9d6}@media(max-width:620px){.output{grid-template-columns:1fr}}
</style>
<main>
<h1>RL Maze Explorer 학습</h1>
<p>이 PC의 브라우저에서 PPO를 학습합니다. 체크포인트는 JSON으로 저장하고 불러올 수 있습니다.</p>
<section>
<div class="controls">
<label>미로 크기 <select id="size"><option>7</option><option selected>15</option><option>31</option><option>64</option></select></label>
<label>추가 학습 스텝 <input id="steps" type="number" min="1" max="10000000" value="10000"></label>
<label>무작위 시드 <input id="seed" type="number" min="0" max="4294967295" value="42"></label>
<label>귀환 연습 비율 (%) <input id="practice" type="number" min="0" max="100" value="30"></label>
</div>
<div class="controls" style="margin-top:14px">
<button id="start" class="primary">새 학습</button><button id="resume" disabled>이어 학습</button><button id="stop" disabled>저장 후 정지</button><button id="save" disabled>모델 다운로드</button>
<label>브라우저 모델 JSON 불러오기 <input id="file" type="file" accept=".json,application/json"></label>
</div>
<p id="status" role="status">대기 중</p><progress id="progress" max="1" value="0" aria-label="학습 진행률"></progress>
</section>
<section class="output">
<div><canvas id="map" width="320" height="320" aria-label="로봇과 관측한 미로"></canvas><small>하늘색 로봇 · 노란색 충전소 · 초록색 출구 · 어두운 칸은 미관측</small></div>
<div><h2>학습 기록</h2><dl><dt>누적 스텝</dt><dd id="total">0</dd><dt>완료 에피소드</dt><dd id="episodes">0</dd><dt>일반 탈출률</dt><dd id="success">—</dd><dt>귀환 연습 충전율</dt><dd id="charge">—</dd><dt>성공 시 평균 턴</dt><dd id="turns">—</dd><dt>배터리 소진</dt><dd id="depleted">0</dd></dl></div>
</section>
</main>
<script id="worker" type="text/plain">
'use strict';
const directions = [[0,-1],[1,0],[0,1],[-1,0]];
const width = 48, inputs = 34, outputs = 5;
const outputOffset = width * (inputs + 1);
const parameterCount = outputOffset + outputs * (width + 1);
const format = 'rl-maze-browser-ppo-1';
const choice = (items, rng) => items[Math.floor(rng.next() * items.length)];
const pause = () => new Promise(resolve => setTimeout(resolve, 0));

class Random {
  constructor(seed) { this.state = seed >>> 0; }
  next() {
    this.state = (this.state + 0x6d2b79f5) >>> 0;
    let x = this.state;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  }
}

class Maze {
  constructor(size, rng) {
    this.size = size;
    const n = size;
    for (;;) {
      this.grid = new Int8Array(n*n).fill(1);
      const stack = [n+1];
      this.grid[n+1] = 0;
      while (stack.length) {
        const cell = stack[stack.length-1], x = cell % n, y = Math.floor(cell/n);
        const options = directions.map(([dx,dy]) => [x+2*dx,y+2*dy])
          .filter(([a,b]) => a>0 && b>0 && a<n-1 && b<n-1 && this.grid[b*n+a]);
        if (!options.length) { stack.pop(); continue; }
        const [a,b] = choice(options,rng), next = b*n+a;
        this.grid[next] = this.grid[(cell+next)/2] = 0;
        stack.push(next);
      }
      const edge = [];
      const last = (n-2)%2 ? n-2 : n-3;
      for (let k=1;k<=last;k+=2) {
        edge.push([0,k,k+n],[1,k*n+n-1,k*n+last],[2,(n-1)*n+k,last*n+k],[3,k*n,k*n+1]);
      }
      const interior = this.grid;
      for (let attempt=0;attempt<128;attempt++) {
        const a=choice(edge,rng), b=choice(edge,rng);
        if (a[0]===b[0]) continue;
        this.grid=interior.slice();
        for (const [,port,inner] of [a,b]) {
          this.grid[port]=0;
          if (Math.abs(port-inner)>n || (Math.floor(port/n)===Math.floor(inner/n) && Math.abs(port-inner)>1))
            this.grid[(port+inner)/2]=0;
        }
        const route=this.route(a[1],b[1],(a[0]+2)%4);
        if (route && route.moves>=n) {
          this.start=a[1]; this.goal=b[1]; this.inward=(a[0]+2)%4;
          this.capacity=Math.ceil(route.energy*1.25);
          return;
        }
      }
    }
  }
  offset(cell, dx, dy) {
    const x=cell%this.size+dx, y=Math.floor(cell/this.size)+dy;
    return x<0 || y<0 || x>=this.size || y>=this.size ? -1 : y*this.size+x;
  }
  next(cell, heading) { return this.offset(cell,...directions[heading]); }
  open(cell) { return cell>=0 && this.grid[cell]===0; }
  route(from,to,heading) {
    const parents=new Int32Array(this.grid.length).fill(-1), queue=[from];
    parents[from]=from;
    for(let i=0;i<queue.length && parents[to]<0;i++) {
      for(let d=0;d<4;d++) {
        const cell=this.next(queue[i],d);
        if(this.open(cell) && parents[cell]<0) { parents[cell]=queue[i]; queue.push(cell); }
      }
    }
    if(parents[to]<0) return null;
    const headings=[];
    for(let at=to;at!==from;at=parents[at]) {
      const previous=parents[at];
      headings.push(directions.findIndex((_,d)=>this.next(previous,d)===at));
    }
    let energy=0;
    for(const d of headings.reverse()) {
      const turn=(d-heading+4)%4;
      energy+=2+Math.min(turn,4-turn);
      heading=d;
    }
    return {energy,heading,moves:headings.length};
  }
}

class Robot {
  constructor(size,rng,practiceRate) {
    this.maze=new Maze(size,rng);
    this.reset();
    if(rng.next()>=practiceRate) return;
    const visited=new Set([this.cell]);
    const moves=2+Math.floor(rng.next()*4);
    for(let i=0;i<moves;i++){
      const choices=[0,1,2,3].filter(d=>{
        const next=this.maze.next(this.cell,d);
        return this.maze.open(next) && next!==this.maze.goal && !visited.has(next);
      });
      if(!choices.length) { this.reset(); return; }
      this.heading=choice(choices,rng);
      this.cell=this.maze.next(this.cell,this.heading); visited.add(this.cell); this.observe();
    }
    const back=this.maze.route(this.cell,this.maze.start,this.heading);
    const out=this.maze.route(this.cell,this.maze.goal,this.heading);
    const charged=this.maze.route(this.maze.start,this.maze.goal,back.heading);
    if(back.energy+2<out.energy && back.energy+2<this.maze.capacity && charged.energy<=this.maze.capacity) {
      this.energy=back.energy+2; this.practice=true;
    } else this.reset();
  }
  reset() {
    this.cell=this.maze.start; this.heading=this.maze.inward; this.energy=this.maze.capacity;
    this.memory=new Int8Array(this.maze.grid.length).fill(-1);
    this.turns=0; this.charges=0; this.collision=false; this.practice=false; this.history=[];
    this.observe();
  }
  observe() {
    let fresh=0;
    const [dx,dy]=directions[this.heading];
    const reveal=(id,detail)=>{
      if(id<0) return;
      if(this.memory[id]===-1) fresh++;
      if(detail || this.memory[id]===-1)
        this.memory[id]=detail && id===this.maze.start ? 3 : detail && id===this.maze.goal ? 2 : this.maze.grid[id];
    };
    this.range=0;
    for(let d=0;d<this.maze.size;d++) {
      const at=this.maze.offset(this.cell,d*dx,d*dy);
      if(at<0) break;
      reveal(at,d<=3);
      if(!this.maze.open(at)) break;
      this.range=d;
      if(d<=3) {
        reveal(this.maze.offset(at,-dy,dx),true);
        reveal(this.maze.offset(at,dy,-dx),true);
      }
    }
    return fresh;
  }
  canCharge() { return this.cell===this.maze.start && this.energy*2<=this.maze.capacity; }
  observation() {
    const n=this.maze.size, [dx,dy]=directions[this.heading], x=this.cell%n, y=Math.floor(this.cell/n);
    const data=[x/(n-1),y/(n-1),(this.maze.start%n-x)/(n-1),(Math.floor(this.maze.start/n)-y)/(n-1),
      this.energy/this.maze.capacity,this.range/(n-1),Number(this.canCharge()),Number(this.collision)];
    for(let d=0;d<4;d++) data.push(Number(d===this.heading));
    for(let f=-1;f<=3;f++) for(let s=-1;s<=1;s++) {
      const id=this.maze.offset(this.cell,f*dx-s*dy,f*dy+s*dx);
      const value=id<0?1:this.memory[id];
      data.push(value<0?0:value===1?-1:1);
    }
    for(let d=0;d<4;d++) {
      const id=this.maze.next(this.cell,d);
      data.push(id>=0 && this.memory[id]===2 ? 1 : 0);
    }
    while(data.length<inputs) data.push(0);
    return data;
  }
  step(action) {
    const limit=Math.max(196,4*this.maze.size**2);
    let reward=-0.01, reason='';
    this.collision=false;
    if(action===3 && this.canCharge()) {
      if(this.turns+2<=limit) {
        this.energy=this.maze.capacity; this.charges++;
        reward=-0.02+(this.practice && this.charges===1?0.5:0);
        this.turns++;
      }
    } else if(action===3) {
      reward-=0.05;
    } else {
      const next=this.maze.next(this.cell,this.heading);
      const cost=action===0?2:1;
      if(this.energy<cost) reason='depleted';
      else {
        this.energy-=cost;
        if(action!==0) this.heading=(this.heading+(action===1?3:1))%4;
        else if(this.maze.open(next)) this.cell=next;
        else { this.collision=true; reward-=0.05; }
      }
    }
    this.turns++;
    reward+=this.observe()*0.01;
    if(this.cell===this.maze.goal) { reason='success'; reward+=10; }
    else if(reason==='depleted' || (this.energy===0 && this.cell!==this.maze.start)) {
      reason='depleted'; reward-=1;
    } else if(this.turns>=limit) reason='limit';
    if(!reason && action!==3) {
      const heading=this.cell*4+this.heading;
      this.history.push(heading);
      if(this.history.length>64) this.history.shift();
      if(this.history.filter(x=>x===heading).length>=4) reward-=0.02;
    }
    return {reward,reason};
  }
}

class Policy {
  constructor(rng, checkpoint) {
    this.w=new Float64Array(parameterCount);
    this.m=new Float64Array(parameterCount);
    this.v=new Float64Array(parameterCount);
    this.updates=0;
    if(checkpoint) {
      this.w.set(checkpoint.w); this.m.set(checkpoint.m); this.v.set(checkpoint.v);
      this.updates=checkpoint.updates;
    } else {
      for(let i=0;i<this.w.length;i++) this.w[i]=(rng.next()-0.5)*(i<outputOffset?0.45:0.20);
    }
  }
  forward(x,charge) {
    const hidden=new Float64Array(width), z=new Float64Array(outputs);
    for(let j=0;j<width;j++){
      const offset=j*(inputs+1);
      let sum=this.w[offset+inputs];
      for(let i=0;i<inputs;i++) sum+=this.w[offset+i]*x[i];
      hidden[j]=Math.tanh(sum);
    }
    for(let j=0;j<outputs;j++){
      const offset=outputOffset+j*(width+1);
      let sum=this.w[offset+width];
      for(let i=0;i<width;i++) sum+=this.w[offset+i]*hidden[i];
      z[j]=sum;
    }
    if(!charge) z[3]=-Infinity;
    const max=Math.max(z[0],z[1],z[2],z[3]);
    const p=Array.from(z.slice(0,4),v=>Math.exp(v-max));
    const total=p.reduce((a,b)=>a+b);
    return {hidden,p:p.map(v=>v/total),value:z[4]};
  }
  ppo(batch, bootstrap, rng) {
    let gae=0, next=bootstrap, sum=0, square=0;
    for(let i=batch.length-1;i>=0;i--){
      const item=batch[i], alive=item.done?0:1;
      gae=item.reward+0.99*alive*next-item.value+0.99*0.95*alive*gae;
      item.adv=gae; item.target=gae+item.value;
      sum+=gae; square+=gae*gae; next=item.value;
    }
    const mean=sum/batch.length;
    const deviation=Math.sqrt(Math.max(0,square/batch.length-mean*mean))+1e-8;
    const order=batch.map((_,i)=>i);
    for(let epoch=0;epoch<4;epoch++){
      for(let j=order.length-1;j>0;j--){
        const k=Math.floor(rng.next()*(j+1));
        [order[j],order[k]]=[order[k],order[j]];
      }
      for(let start=0;start<order.length;start+=64){
        const count=Math.min(64,order.length-start);
        const gradient=new Float64Array(parameterCount);
        for(let k=0;k<count;k++){
          const sample=batch[order[start+k]];
          const {hidden,p,value}=this.forward(sample.x,sample.charge);
          const ratio=p[sample.action]/sample.prob;
          const advantage=(sample.adv-mean)/deviation;
          const clipped=(advantage>=0 && ratio>1.2)||(advantage<0 && ratio<0.8);
          const actor=clipped?0:-advantage*ratio;
          const entropy=p.reduce((acc,v)=>acc-(v?v*Math.log(v):0),0);
          const back=new Float64Array(width);
          for(let j=0;j<outputs;j++){
            const delta=j===4?value-sample.target:
              actor*(Number(j===sample.action)-p[j])+(p[j]?0.02*p[j]*(Math.log(p[j])+entropy):0);
            const offset=outputOffset+j*(width+1);
            for(let i=0;i<width;i++){
              gradient[offset+i]+=delta*hidden[i]; back[i]+=delta*this.w[offset+i];
            }
            gradient[offset+width]+=delta;
          }
          for(let j=0;j<width;j++){
            const delta=back[j]*(1-hidden[j]**2), offset=j*(inputs+1);
            for(let i=0;i<inputs;i++) gradient[offset+i]+=delta*sample.x[i];
            gradient[offset+inputs]+=delta;
          }
        }
        this.updates++;
        const norm=Math.hypot(...gradient)/count, scale=Math.min(1,0.5/(norm||1))/count;
        const rate=0.0003*Math.sqrt(1-0.999**this.updates)/(1-0.9**this.updates);
        for(let i=0;i<this.w.length;i++){
          const g=gradient[i]*scale;
          this.m[i]=0.9*this.m[i]+0.1*g;
          this.v[i]=0.999*this.v[i]+0.001*g*g;
          this.w[i]-=rate*this.m[i]/(Math.sqrt(this.v[i])+1e-8);
        }
      }
    }
  }
}

const statsFields=['episodes','navigation','success','practice','charge','depleted','successfulTurns'];
function validate(c) {
  if(!c || c.format!==format || !['steps','updates','seed'].every(k=>Number.isSafeInteger(c[k]) && c[k]>=0) ||
     c.seed>4294967295 || !['w','m','v'].every(k=>Array.isArray(c[k]) && c[k].length===parameterCount &&
       c[k].every(x=>Number.isFinite(x) && Math.abs(x)<1e6 && (k!=='v' || x>=0))) ||
     !c.stats || !statsFields.every(k=>Number.isSafeInteger(c.stats[k]) && c.stats[k]>=0))
    throw new Error('이 브라우저 학습기로 만든 체크포인트 JSON을 선택하세요.');
  return c;
}

let running=false, stop=false;
async function train({size,steps,practice,seed,checkpoint}) {
  if(running) return;
  running=true; stop=false;
  try{
    const initial=checkpoint?validate(checkpoint):null;
    if(![7,15,31,64].includes(size) || !Number.isInteger(steps) || steps<1 || steps>10000000 ||
       !Number.isInteger(seed) || seed<0 || seed>4294967295 || !(practice>=0 && practice<=1))
      throw new Error('학습 입력 범위를 확인하세요.');
    const rng=new Random(initial?initial.seed:seed);
    const policy=new Policy(rng,initial);
    let env=new Robot(size,rng,practice);
    const stats=initial?{...initial.stats}:Object.fromEntries(statsFields.map(k=>[k,0]));
    let completed=0,lastSave=0,lastStatus=-Infinity;
    const snapshot=()=>({format,size,steps:(initial?.steps||0)+completed,seed:rng.state,updates:policy.updates,
      w:Array.from(policy.w),m:Array.from(policy.m),v:Array.from(policy.v),stats:{...stats}});
    while(completed<steps && !stop){
      const batch=[];
      for(let i=0;i<128 && completed<steps;i++){
        const x=env.observation(), charge=env.canCharge();
        const {p,value}=policy.forward(x,charge);
        let roll=rng.next(), action=0;
        while(action<3 && roll>=p[action]) {roll-=p[action];action++;}
        if(p[action]===0) action=p.findLastIndex(v=>v>0);
        const {reward,reason}=env.step(action);
        batch.push({x,charge,action,prob:p[action],value,reward,done:Boolean(reason)});
        completed++;
        if(reason){
          stats.episodes++;
          if(env.practice) {stats.practice++; if(env.charges) stats.charge++;}
          else {
            stats.navigation++;
            if(reason==='success'){stats.success++;stats.successfulTurns+=env.turns;}
          }
          if(reason==='depleted') stats.depleted++;
          env=new Robot(size,rng,practice);
        }
      }
      policy.ppo(batch,policy.forward(env.observation(),env.canCharge()).value,rng);
      if(performance.now()-lastStatus>=150 || completed===steps) {
        postMessage({kind:'progress',completed,target:steps,total:(initial?.steps||0)+completed,stats,
          map:Array.from(env.memory),cell:env.cell,heading:env.heading,size});
        lastStatus=performance.now();
      }
      if(completed-lastSave>=1024) {postMessage({kind:'checkpoint',checkpoint:snapshot()});lastSave=completed;}
      await pause();
    }
    postMessage({kind:'finished',checkpoint:snapshot(),completed,target:steps,stopped:stop});
  } catch(error) {postMessage({kind:'error',message:error.message});}
  finally {running=false;}
}

onmessage=({data})=>{
  if(data.kind==='train') train(data);
  if(data.kind==='stop') stop=true;
  if(data.kind==='validate'){
    try {postMessage({kind:'loaded',checkpoint:validate(data.checkpoint)});}
    catch(error){postMessage({kind:'invalid',message:error.message});}
  }
};
</script>
<script>
'use strict';
const el=id=>document.getElementById(id);
const status=el('status'), progress=el('progress');
const canvas=el('map'), ctx=canvas.getContext('2d');
const storageKey='rl-maze-browser-ppo-1.checkpoint';
let worker, active=false, saved=null;
const pct=(part,whole)=>whole ? (100*part/whole).toFixed(2)+'%' : '—';
function display(total,s) {
  el('total').textContent=total.toLocaleString('ko-KR');
  el('episodes').textContent=s.episodes.toLocaleString('ko-KR');
  el('success').textContent=pct(s.success,s.navigation);
  el('charge').textContent=pct(s.charge,s.practice);
  el('turns').textContent=s.success?(s.successfulTurns/s.success).toFixed(2):'—';
  el('depleted').textContent=s.depleted.toLocaleString('ko-KR');
}
function buttons() {
  el('start').disabled=active; el('resume').disabled=active||!saved;
  el('stop').disabled=!active; el('save').disabled=!saved; el('file').disabled=active;
}
function keep(checkpoint){
  saved=checkpoint;
  try{localStorage.setItem(storageKey,JSON.stringify(checkpoint));}catch{}
  buttons();
}
function draw(data){
  const {map,size,cell,heading}=data, unit=canvas.width/size;
  const colors=['#536d7a','#263b47','#61d894','#f3ca77'];
  for(let i=0;i<map.length;i++){
    const x=Math.floor(i%size*unit),y=Math.floor(Math.floor(i/size)*unit);
    ctx.fillStyle=colors[map[i]]||'#0c141c';
    ctx.fillRect(x,y,Math.ceil(unit),Math.ceil(unit));
  }
  ctx.save();
  ctx.translate((cell%size+0.5)*unit,(Math.floor(cell/size)+0.5)*unit);
  ctx.rotate(heading*Math.PI/2);
  ctx.fillStyle='#79dbff';ctx.beginPath();
  ctx.moveTo(0,-unit*0.44);ctx.lineTo(unit*0.35,unit*0.28);ctx.lineTo(-unit*0.35,unit*0.28);
  ctx.fill();ctx.restore();
}
function handle({data}) {
  switch(data.kind) {
    case 'progress':
      progress.value=data.completed/data.target; display(data.total,data.stats); draw(data); break;
    case 'checkpoint': keep(data.checkpoint); break;
    case 'finished':
      active=false; keep(data.checkpoint); display(saved.steps,saved.stats);
      progress.value=data.completed/data.target;
      status.textContent=data.stopped?'정지했습니다. 체크포인트를 다운로드할 수 있습니다.':'학습을 완료했습니다. 체크포인트를 다운로드할 수 있습니다.';
      break;
    case 'loaded':
      keep(data.checkpoint); display(saved.steps,saved.stats);
      if([7,15,31,64].includes(saved.size)) el('size').value=saved.size;
      status.textContent='모델을 불러왔습니다. 이어 학습을 누르세요.'; break;
    case 'error': active=false; buttons(); status.textContent=data.message; break;
    case 'invalid': status.textContent=data.message; break;
  }
}
try{
  const url=URL.createObjectURL(new Blob([el('worker').textContent],{type:'text/javascript'}));
  worker=new Worker(url);
  worker.onmessage=handle;
  worker.onerror=()=>{active=false; buttons(); el('start').disabled=el('resume').disabled=true;
    status.textContent='브라우저에서 학습 작업을 시작하지 못했습니다. 이 HTML 파일을 Chrome 또는 Edge에서 열어 주세요.';};
  window.addEventListener('pagehide',()=>URL.revokeObjectURL(url),{once:true});
  try{const json=localStorage.getItem(storageKey);if(json)worker.postMessage({kind:'validate',checkpoint:JSON.parse(json)});}catch{}
}catch{
  status.textContent='브라우저가 학습 작업을 실행할 수 없습니다.';
  el('start').disabled=true;
}
function start(checkpoint) {
  if(active||!worker) return;
  if(!['steps','seed','practice'].every(id=>el(id).value!=='' && el(id).checkValidity())){
    status.textContent='학습 스텝, 시드, 귀환 연습 비율의 범위를 확인하세요.'; return;
  }
  active=true;buttons();progress.value=0;status.textContent='이 PC에서 학습 중…';
  worker.postMessage({kind:'train',size:Number(el('size').value),steps:Number(el('steps').value),
    seed:Number(el('seed').value),practice:Number(el('practice').value)/100,checkpoint});
}
el('start').onclick=()=>start(null);
el('resume').onclick=()=>start(saved);
el('stop').onclick=()=>{el('stop').disabled=true;status.textContent='현재 학습 묶음을 마친 뒤 정지합니다…';worker.postMessage({kind:'stop'});};
el('save').onclick=()=>{
  if(!saved)return;
  const url=URL.createObjectURL(new Blob([JSON.stringify(saved)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='maze-ppo-'+saved.steps+'-steps.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
el('file').onchange=async event=>{
  const file=event.target.files[0];event.target.value='';
  if(!file || active || !worker)return;
  try{
    if(file.size>2000000) throw new Error();
    worker.postMessage({kind:'validate',checkpoint:JSON.parse(await file.text())});
  }catch{status.textContent='이 브라우저 학습기에서 다운로드한 JSON 파일을 선택하세요.';}
};
</script>
</html>
